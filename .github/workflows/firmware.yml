name: Firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ui-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same LVGL version as firmware/dependencies.lock.
      - run: git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Render UI snapshots
        env:
          LVGL_DIR: ${{ runner.temp }}/lvgl
          POCKET_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: |
          mkdir -p "$POCKET_SNAPSHOT_DIR"
          python -m unittest discover -s tests -p test_firmware_host.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/snapshots

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        working-directory: firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py size
      - name: Native task client against SDK cJSON
        shell: bash
        run: |
          export POCKET_CJSON_DIR="$IDF_PATH/components/json/cJSON"
          python -m unittest discover -s tests -p test_firmware_tasks_client.py -v
